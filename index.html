<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requisition Form Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" crossorigin="anonymous"></script>
    
    <script src="https://unpkg.com/pizzip@3.1.7/dist/pizzip.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/docxtemplater@3.45.0/build/docxtemplater.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6">

    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
        <h1 class="text-2xl font-bold text-gray-900 mb-6 border-b pb-4">Requisition Form Processor</h1>
        
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Applicant Name <span class="text-gray-400 font-normal">(Optional)</span></label>
                <input type="text" id="userName" placeholder="e.g., John Doe" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Upload CSV Data File</label>
                <input type="file" id="csvFile" accept=".csv" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <p class="text-xs text-gray-400 mt-1">Accepts formats like: 11-May-26 or 11 May 2026</p>
            </div>

            <div id="previewSection" class="hidden border rounded-lg p-4 bg-gray-50 max-h-60 overflow-y-auto">
                <h3 class="text-sm font-bold text-gray-700 mb-2">CSV Data Preview</h3>
                <table class="w-full text-xs text-left border-collapse bg-white">
                    <thead>
                        <tr class="bg-gray-100 border-b">
                            <th class="p-2 border">Date</th>
                            <th class="p-2 border">Description</th>
                            <th class="p-2 border">HKDAmount</th>
                            <th class="p-2 border">Remarks</th>
                        </tr>
                    </thead>
                    <tbody id="previewTableBody"></tbody>
                </table>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Upload Signature Image <span class="text-gray-400 font-normal">(Optional, supports PNG & JPG)</span></label>
                <input type="file" id="sigFile" accept="image/png, image/jpeg, image/jpg" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <button id="processBtn" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition shadow-sm cursor-pointer">
                Verify & Process Data
            </button>
        </div>

        <div id="statusMessage" class="hidden mt-6 p-4 rounded-lg text-sm"></div>

        <div id="downloadSection" class="hidden mt-8 border-t pt-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-3">Files Available for Download</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <button id="downloadXlsx" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 px-4 rounded-lg font-medium transition shadow-sm cursor-pointer text-center">
                    Download Excel (.xlsx)
                </button>
                <button id="downloadDocx" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg font-medium transition shadow-sm cursor-pointer text-center">
                    Download Word (.docx)
                </button>
                <button id="downloadCsv" class="bg-gray-600 hover:bg-gray-700 text-white py-2 px-4 rounded-lg font-medium transition shadow-sm cursor-pointer text-center">
                    Export original CSV
                </button>
            </div>
        </div>
    </div>

    <script>
        let parsedCsvData = [];
        let rawCsvFileContent = null;
        let signatureBase64 = null;
        let signatureExtension = null;
        let signatureWidth = 0;
        let signatureHeight = 0;
        let generatedWorkbookBlob = null;
        let generatedDocxBlob = null;

        // UI Target references
        const processBtn = document.getElementById('processBtn');
        const statusMessage = document.getElementById('statusMessage');
        const downloadSection = document.getElementById('downloadSection');
        const previewSection = document.getElementById('previewSection');
        const previewTableBody = document.getElementById('previewTableBody');

        // Parse and preview CSV dynamically when chosen
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            rawCsvFileContent = file;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                transformHeader: function(h) { return h.trim(); },
                complete: function(results) {
                    const headers = results.meta.fields || [];
                    const requiredHeaders = ['Date', 'Description', 'HKDAmount', 'Remarks'];
                    const hasHeaders = requiredHeaders.every(h => headers.includes(h));

                    if (!hasHeaders) {
                        showStatus("CSV Error: Column headers must exactly match: Date, Description, HKDAmount, Remarks", "error");
                        previewSection.classList.add('hidden');
                        parsedCsvData = [];
                        return;
                    }

                    const datePattern = /^\d{1,2}[-\s][A-Za-z]{3}[-\s]\d{2,4}$/;
                    let formatErrors = [];

                    parsedCsvData = results.data;
                    previewTableBody.innerHTML = '';

                    parsedCsvData.forEach((row, i) => {
                        const displayDate = row.Date ? row.Date.trim() : '';
                        const displayDesc = row.Description ? row.Description.trim() : '';
                        const displayAmount = row.HKDAmount ? row.HKDAmount.trim() : '';
                        const displayRemarks = row.Remarks ? row.Remarks.trim() : '';

                        if (!datePattern.test(displayDate)) {
                            formatErrors.push(`Row ${i+1}: Date "${displayDate}" must match DD-MMM-YY or DD MMM YYYY format.`);
                        }
                        if (!displayDesc) {
                            formatErrors.push(`Row ${i+1}: Description cannot be blank.`);
                        }
                        if (isNaN(parseFloat(displayAmount)) || !isFinite(displayAmount)) {
                            formatErrors.push(`Row ${i+1}: HKDAmount "${displayAmount}" must be a valid numeric calculation.`);
                        }

                        const tr = document.createElement('tr');
                        tr.className = "border-b hover:bg-gray-50";
                        tr.innerHTML = `
                            <td class="p-2 border">${displayDate}</td>
                            <td class="p-2 border truncate max-w-xs">${displayDesc}</td>
                            <td class="p-2 border">${displayAmount}</td>
                            <td class="p-2 border text-gray-500">${displayRemarks}</td>
                        `;
                        previewTableBody.appendChild(tr);
                    });

                    if (formatErrors.length > 0) {
                        showStatus("Format Verification Error:\n" + formatErrors.slice(0, 3).join("\n"), "error");
                        previewSection.classList.add('hidden');
                        parsedCsvData = [];
                        return;
                    }

                    previewSection.classList.remove('hidden');
                    statusMessage.classList.add('hidden');
                }
            });
        });

        // Track and process signature data safely across formats (PNG/JPG)
        document.getElementById('sigFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) {
                signatureBase64 = null;
                signatureExtension = null;
                return;
            }
            signatureExtension = file.name.split('.').pop().toLowerCase();
            if (signatureExtension === 'jpg') signatureExtension = 'jpeg';
            
            const reader = new FileReader();
            reader.onload = function(event) {
                signatureBase64 = event.target.result.split(',')[1];
                
                const img = new Image();
                img.onload = function() {
                    signatureWidth = this.width;
                    signatureHeight = this.height;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        processBtn.addEventListener('click', async () => {
            const name = document.getElementById('userName').value.trim() || ""; 

            if (parsedCsvData.length === 0) return showStatus("Please upload a valid CSV data file first.", "error");

            try {
                showStatus("Compiling files and populating template models...", "info");
                
                await processWorkbook(name);
                await processDocxTemplate(name);
                
                showStatus("Success! Your documents are prepared and ready for download.", "success");
                downloadSection.classList.remove('hidden');
            } catch (err) {
                console.error(err);
                showStatus(`Error processing templates: ${err.message}`, "error");
            }
        });

        async function processWorkbook(name) {
            const response = await fetch('REQ_CASH_Form_Template.xlsx');
            if (!response.ok) throw new Error("Excel Template file could not be found via server root.");
            const arrayBuffer = await response.arrayBuffer();

            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(arrayBuffer);
            const worksheet = workbook.getWorksheet('Form');
            if (!worksheet) throw new Error("Worksheet named 'Form' was not found in template.");

            const totalRows = parsedCsvData.length;
            if (totalRows > 1) {
                worksheet.duplicateRow(4, totalRows - 1, true);
            }

            parsedCsvData.forEach((row, idx) => {
                const rowNum = 4 + idx;
                worksheet.getCell(`A${rowNum}`).value = idx + 1;
                worksheet.getCell(`B${rowNum}`).value = row.Date ? row.Date.trim() : '';
                worksheet.getCell(`C${rowNum}`).value = row.Description ? row.Description.trim() : '';
                worksheet.getCell(`D${rowNum}`).value = row.HKDAmount ? Number(row.HKDAmount.trim()) : 0;
                worksheet.getCell(`E${rowNum}`).value = row.Remarks ? row.Remarks.trim() : '';
            });

            const shiftOffset = totalRows - 1;
            const targetSigRow = 12 + shiftOffset;
            const targetNameRow = 13 + shiftOffset;

            worksheet.getCell(`C${targetNameRow}`).value = name;

            if (signatureBase64 && signatureWidth > 0 && signatureHeight > 0) {
                const imageId = workbook.addImage({
                    base64: signatureBase64,
                    extension: signatureExtension,
                });
                
                const maxCellWidthPx = 130;  
                const maxCellHeightPx = 55; 
                let finalWidth = maxCellWidthPx;
                let finalHeight = maxCellHeightPx;

                const srcRatio = signatureWidth / signatureHeight;
                const targetRatio = maxCellWidthPx / maxCellHeightPx;

                if (srcRatio > targetRatio) {
                    finalHeight = maxCellWidthPx / srcRatio;
                } else {
                    finalWidth = maxCellHeightPx * srcRatio;
                }

                worksheet.addImage(imageId, {
                    tl: { col: 2, row: targetSigRow - 1, editAs: 'oneCell' },
                    ext: { width: finalWidth, height: finalHeight }
                });
            }

            const buffer = await workbook.xlsx.writeBuffer();
            generatedWorkbookBlob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            setupDownloadActions(name);
        }

        // Native injection module directly attached to resolve external library drops
        function getNativeInlineImageModule() {
            return {
                set: function(obj) { this.options = obj; },
                optionsTransformer: function(options, docxtemplater) {
                    const relsModifier = {
                        class: class {
                            parse(zip) { this.zip = zip; }
                            postrender(parts) {
                                // Scans document text nodes dynamically for signature tags
                                parts.forEach(part => {
                                    if (part.type === 'placeholder' && part.value === '%SIGNATURE' && signatureBase64) {
                                        const maxWidth = 150;
                                        const scaleFactor = signatureWidth > maxWidth ? maxWidth / signatureWidth : 1;
                                        const w = Math.round(signatureWidth * scaleFactor);
                                        const h = Math.round(signatureHeight * scaleFactor);
                                        
                                        // Standard OpenXML container schema for embedding inline binary elements safely
                                        const cx = w * 9525; 
                                        const cy = h * 9525;
                                        
                                        part.type = 'content';
                                        part.value = `<w:p><w:r><w:drawing><wp:inline><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="1" name="Signature"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><pic:pic><pic:nvPicPr><pic:cNvPr id="0" name="sig.${signatureExtension}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdCustomSig"/></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
                                    }
                                });
                            }
                        }
                    };
                    docxtemplater.modules.push(relsModifier);
                    return options;
                }
            };
        }

        async function processDocxTemplate(name) {
            const response = await fetch('Claim_Template.docx');
            if (!response.ok) throw new Error("Word Template file ('Claim_Template.docx') not found in repo root.");
            const arrayBuffer = await response.arrayBuffer();
            const zip = new PizZip(arrayBuffer);

            // Inject custom document relation maps safely for binary tracking inside zip archives
            if (signatureBase64) {
                let documentRels = zip.file("word/_rels/document.xml.rels").asText();
                if (!documentRels.includes("rIdCustomSig")) {
                    const closingTagIndex = documentRels.lastIndexOf("</Relationships>");
                    const newRel = `<Relationship Id="rIdCustomSig" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/signature_asset.${signatureExtension}"/>`;
                    documentRels = documentRels.substring(0, closingTagIndex) + newRel + "</Relationships>";
                    zip.file("word/_rels/document.xml.rels", documentRels);
                }
                const binaryData = Uint8Array.from(window.atob(signatureBase64), c => c.charCodeAt(0));
                zip.file(`word/media/signature_asset.${signatureExtension}`, binaryData);
            }

            const doc = new window.docxtemplater(zip, {
                paragraphLoop: true,
                linebreaks: true,
            });

            const templateItemsArray = parsedCsvData.map((row, idx) => {
                const finalRemarks = (row.Remarks && row.Remarks.trim()) ? row.Remarks.trim() : "N/A";
                
                // Tight inline run break completely preventing structural spacing overflows or extra empty pages
                const isLastItem = idx === parsedCsvData.length - 1;
                const breakXmlSnippet = isLastItem ? "" : '<w:r><w:br w:type="page"/></w:r>';

                return {
                    NAME: name,
                    DATE: row.Date ? row.Date.trim() : '',
                    DESCRIPTION: row.Description ? row.Description.trim() : '',
                    AMOUNT_HKD: row.HKDAmount ? parseFloat(row.HKDAmount.trim()).toFixed(2) : '0.00',
                    REMARKS: finalRemarks,
                    // Fall back to simple empty text node cleanly if no signature file is uploaded
                    SIGNATURE: signatureBase64 ? "%SIGNATURE" : "", 
                    PAGE_BREAK: breakXmlSnippet
                };
            });

            doc.render({
                items: templateItemsArray
            });

            const out = doc.getZip().generate({
                type: "blob",
                mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            });
            generatedDocxBlob = out;
        }

        function setupDownloadActions(name) {
            const timestamp = getTimestampString();
            const safeName = name ? name.replace(/[^a-z0-9]/gi, '_') : "Applicant";
            const baseFileName = `${safeName}_REQ_CASH_Form_${timestamp}`;

            document.getElementById('downloadXlsx').onclick = () => {
                triggerBlobDownload(generatedWorkbookBlob, `${baseFileName}.xlsx`);
            };

            document.getElementById('downloadDocx').onclick = () => {
                if (generatedDocxBlob) {
                    triggerBlobDownload(generatedDocxBlob, `${baseFileName}.docx`);
                }
            };

            document.getElementById('downloadCsv').onclick = () => {
                if (rawCsvFileContent) {
                    triggerBlobDownload(rawCsvFileContent, `${baseFileName}.csv`);
                }
            };
        }

        function getTimestampString() {
            const d = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
        }

        function triggerBlobDownload(blob, filename) {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        function showStatus(msg, type) {
            statusMessage.classList.remove('hidden', 'bg-blue-50', 'text-blue-700', 'bg-red-50', 'text-red-700', 'bg-emerald-50', 'text-emerald-700');
            if (type === 'info') {
                statusMessage.classList.add('bg-blue-50', 'text-blue-700');
            } else if (type === 'error') {
                statusMessage.classList.add('bg-red-50', 'text-red-700');
            } else if (type === 'success') {
                statusMessage.classList.add('bg-emerald-50', 'text-emerald-700');
            }
            statusMessage.innerText = msg;
        }
    </script>
</body>
</html>
